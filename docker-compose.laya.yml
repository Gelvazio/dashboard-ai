# Iniciar: docker compose -f docker-compose.laya.yml up -d --build laya-serve
# Parar: docker compose -f docker-compose.laya.yml down
# Windows: scripts/start-laya.bat e scripts/stop-laya.bat
# LAYA_SOURCE aponta para o checkout local upstream v0.4.6; ajuste no .env se necessário.
name: dashboard-ai-laya

services:
  laya-serve:
    image: dashboard-ai/laya-serve:0.4.6
    build:
      context: ${LAYA_SOURCE:-../dashboard-ai-claude-code-senai/laya}
      args:
        TORCH_INDEX: "${LAYA_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${LAYA_TORCH_VERSION:-2.14.0}"
    command: ["laya-serve"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "8000"
      LAYA_DEVICE: "${LAYA_DEVICE:-cpu}"
      LAYA_PRELOAD: "${LAYA_PRELOAD:-0}"
      LAYA_MODELS: "${LAYA_MODELS:-}"
      LAYA_THREADS: "${LAYA_THREADS:-4}"
      LAYA_API_KEY: "${LAYA_API_KEY:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - model-cache:/home/laya/.cache/huggingface
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['LAYA_PORT'] + '/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 2s

volumes:
  model-cache:
